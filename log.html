<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AERA Inv">
<meta name="theme-color" content="#001B5E">
<link rel="manifest" href="./manifest.json">
<title>AERA — Nhật ký</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pb:#0038BC;--pb-deep:#001B5E;--plat:#EEEEEE;--dim:#C9CDD4;--red:#E5484D;--green:#30A46C;--amber:#FFB224}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:var(--pb-deep);color:var(--plat);min-height:100vh}
nav{display:flex;gap:20px;padding:16px 28px;background:rgba(0,27,94,.85);border-bottom:1px solid rgba(238,238,238,.15);overflow-x:auto;white-space:nowrap}
nav a{color:var(--dim);text-decoration:none;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
nav a.active,nav a:hover{color:#fff;border-bottom:2px solid var(--plat)}
.hero{display:flex;align-items:flex-end;gap:14px;padding:24px 28px 8px}
.hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.hero p{font-size:12px;color:var(--dim);letter-spacing:1px;padding-bottom:4px}
.wrap{max-width:1200px;margin:0 auto;padding:16px 20px 64px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.chip{border:1px solid rgba(238,238,238,.2);background:transparent;color:var(--dim);
  font-family:inherit;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;
  padding:8px 14px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--plat);color:var(--pb-deep);border-color:var(--plat)}
.chip b{font-weight:800}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:rgba(238,238,238,.15)}
.entry{position:relative;margin-bottom:14px}
.entry:before{content:"";position:absolute;left:-25px;top:22px;width:11px;height:11px;border-radius:50%;
  border:2px solid var(--pb-deep);box-sizing:border-box}
.k-sale:before{background:var(--red)}
.k-produce:before{background:var(--green)}
.k-recount:before{background:var(--amber)}
.k-restock:before{background:#5B8DEF}
.ehead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.tag{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;
  padding:4px 9px;border-radius:4px}
.t-sale{background:rgba(229,72,77,.18);color:#FF8A8E}
.t-produce{background:rgba(48,164,108,.18);color:#5FD79B}
.t-recount{background:rgba(255,178,36,.18);color:#FFC964}
.t-restock{background:rgba(91,141,239,.18);color:#9DBBFF}
.edate{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.5px}
.enote{font-size:13.5px;font-weight:600;flex:1 1 240px;line-height:1.4}
.ecommit{font-size:10px;color:var(--dim);border:1px solid rgba(238,238,238,.2);
  border-radius:4px;padding:3px 7px;font-family:ui-monospace,Menlo,monospace}
.rows{border-top:1px solid rgba(238,238,238,.1)}
.row{display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;align-items:center;
  padding:7px 2px;border-bottom:1px solid rgba(238,238,238,.06)}
.rname{font-size:12.5px;color:var(--plat);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font-size:12px;font-family:ui-monospace,Menlo,monospace;color:var(--dim);text-align:right}
.arw{color:var(--dim);font-size:11px}
.num.now{color:#fff;font-weight:700}
.dlt{font-size:11.5px;font-family:ui-monospace,Menlo,monospace;font-weight:700;
  min-width:64px;text-align:right}
.d-neg{color:#FF8A8E}.d-pos{color:#5FD79B}.d-zero{color:var(--dim)}
.foot{font-size:11px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;
  text-align:center;padding:26px 20px 8px}
.empty{font-size:13px;color:var(--dim);padding:40px 0;text-align:center}
@media(max-width:640px){
  nav{gap:14px;padding:12px 16px}
  .hero{padding:18px 16px 6px;flex-direction:column;align-items:flex-start;gap:4px}
  .hero h1{font-size:22px}
  .wrap{padding:12px 14px 48px}
  .tl{padding-left:20px}
  .entry:before{left:-20px}
  .tl:before{left:5px}
  .row{grid-template-columns:1fr auto auto auto auto;gap:5px}
  .rname{font-size:11.5px}
  .num{font-size:11px}
  .dlt{min-width:48px;font-size:10.5px}
}
</style>
</head>
<body>

<div class="wrap">
<div class="bar" id="bar"></div>
<div class="tl" id="tl"></div>
</div>
<footer class="foot">AERA · ORGANIC MODERNISM · PERSIAN BLUE × PLATIN</footer>

<script src="./log_main.js?v=1"></script>
</body>
</html>
