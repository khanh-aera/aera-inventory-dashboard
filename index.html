<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERA — Inventory Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--pb:#0038BC;--pb-deep:#001B5E;--plat:#EEEEEE;--dim:#C9CDD4;--red:#E5484D;--green:#30A46C;--amber:#FFB224}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:var(--pb-deep);color:var(--plat);min-height:100vh}
nav{display:flex;gap:20px;padding:16px 28px;background:rgba(0,27,94,.85);border-bottom:1px solid rgba(238,238,238,.15)}
nav a{color:var(--dim);text-decoration:none;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
nav a.active,nav a:hover{color:#fff;border-bottom:2px solid var(--plat)}
.hero{padding:36px 28px 8px;text-align:center}
.hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.hero p{font-size:12px;color:var(--dim);margin-top:6px;letter-spacing:1px}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 64px}
#errbox{display:none;background:var(--red);color:#fff;padding:12px;text-align:center;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
.stat{background:rgba(238,238,238,.05);border:1px solid rgba(238,238,238,.12);border-radius:14px;padding:18px;text-align:center}
.stat .num{font-size:36px;font-weight:800}.stat .lbl{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:4px}
.stat.blue .num{color:#7EA6FF}.stat.red .num{color:var(--red)}.stat.green .num{color:var(--green)}.stat.amber .num{color:var(--amber)}
.card{background:rgba(238,238,238,.05);border:1px solid rgba(238,238,238,.12);border-radius:16px;padding:22px;margin-bottom:24px}
.card h2{font-size:13px;letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.chart-box{position:relative;height:280px}.chart-box canvas{max-height:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:9px 11px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);border-bottom:2px solid rgba(238,238,238,.25)}
tbody td{padding:9px 11px;border-bottom:1px solid rgba(238,238,238,.08)}
tbody tr:hover{background:rgba(238,238,238,.04)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:1px}
.badge.ok{background:rgba(48,164,108,.16);color:var(--green);border:1px solid rgba(48,164,108,.4)}
.badge.low{background:rgba(229,72,77,.16);color:var(--red);border:1px solid rgba(229,72,77,.4)}
.badge.crit{background:rgba(255,178,36,.14);color:var(--amber);border:1px solid rgba(255,178,36,.45)}
.badge.unused{background:rgba(238,238,238,.08);color:var(--dim);border:1px solid rgba(238,238,238,.2)}
.cat-tag{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:10px 16px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:1px;border:1px solid rgba(238,238,238,.25);background:transparent;color:var(--dim);cursor:pointer;font-family:inherit;text-transform:uppercase}
.chip.active{background:var(--pb);border-color:var(--pb);color:#fff}
.bar{height:8px;border-radius:4px;background:rgba(238,238,238,.1);overflow:hidden;min-width:130px}
.bar>div{height:100%;border-radius:4px}
.lamp-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.capacity{font-size:13px;font-weight:700;margin-bottom:14px;padding:10px 14px;border-radius:10px;background:rgba(0,56,188,.25);border:1px solid rgba(126,166,255,.35)}
.capacity b{font-size:20px;color:#7EA6FF}
.parts-grid{display:none;flex-direction:column;gap:10px}
.parts-grid.show{display:flex}
.part{display:grid;grid-template-columns:1fr 90px 150px 110px;align-items:center;gap:14px;background:rgba(0,27,94,.6);border:1px solid rgba(238,238,238,.14);border-radius:12px;padding:12px 18px}
.part .pn{font-size:14.5px;font-weight:600;line-height:1.35;display:flex;align-items:center;gap:10px}
.pchip{width:18px;height:18px;border-radius:6px;flex-shrink:0;border:1px solid rgba(255,255,255,.35);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.part .pv{text-align:right}
.part .ps{font-size:26px;font-weight:800;color:#7EA6FF}
.part .ps.warn{color:#EEEEEE}
.part .pu{font-size:11px;color:var(--dim);margin-left:4px}
.pbar{height:10px;border-radius:5px;background:rgba(238,238,238,.12);overflow:hidden}
.pbar>div{height:100%;border-radius:5px}
.pcap{font-size:12.5px;color:var(--dim);text-align:right}
.pcap b{color:#EEEEEE;font-size:15px}
@media(max-width:640px){
.part{grid-template-columns:1fr auto;grid-template-rows:auto auto auto;row-gap:8px;padding:14px 16px}
.part .pn{grid-column:1/3;font-size:15px}
.part .pv{grid-row:2;grid-column:1;text-align:left}
.part .ps{font-size:30px}
.pbar{grid-row:2;grid-column:2;height:12px;align-self:center}
.pcap{grid-column:1/3;grid-row:3;text-align:left;font-size:12.5px}
.pcap b{font-size:17px}
}
@media(max-width:640px){.hm{display:none}tbody td{padding:12px 10px;font-size:14.5px}thead th{padding:10px;font-size:11px}.wrap{padding:16px 12px 48px}.card{padding:16px 14px;border-radius:14px}.hero h1{font-size:24px}}
footer{text-align:center;padding:24px;font-size:11px;letter-spacing:2px;color:var(--dim);opacity:.7}
</style>
</head>
<body>
<nav><a href="./" class="active">Tổng quan</a><a href="./filaments.html">Filament 🧵</a></nav>
<div class="hero"><h1>Inventory Dashboard</h1><p id="updated">AERA LOGISTIC</p></div>
<div class="wrap">
<div id="errbox"></div>
<div class="stats" id="stats"></div>
<div class="grid2" style="margin-bottom:24px">
<div class="card"><h2>● Stock theo Category</h2><div class="chart-box"><canvas id="catChart"></canvas></div></div>
<div class="card"><h2>● Tình trạng kho</h2><div class="chart-box"><canvas id="statusChart"></canvas></div></div>
</div>
<div class="card">
<h2>● Linh kiện đèn đang bán</h2>
<div class="lamp-tabs" id="lampTabs"></div>
<div id="lampPanels"></div>
</div>
<div class="card">
<h2>● Toàn bộ kho</h2>
<div class="filters" id="filters"></div>
<div style="overflow-x:auto">
<table>
<thead><tr><th>Material</th><th class="hm">Category</th><th>Stock</th><th class="hm">Unit</th><th class="hm">Mức độ</th><th>Status</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>
</div>
<footer>AERA · ORGANIC MODERNISM · PERSIAN BLUE × PLATINUM</footer>
<script>
const LAMPS = {
 'FLORIA (thường)': ['Nhựa PLA - trong suốt R3D','floria_desert_tan_base','floria_olive_green_base','floria_matte_red_base','floria_burnt_orange_base','floria_persian_blue_base','floria_milky_base','Dây đèn + đuôi đèn','Bóng đèn OSRAM LED (3W, 3000K)','Hộp carton loại 1','Tờ infor Floria'],
 'FLORIA PRO': ['Nhựa PLA - trong suốt R3D','floria_desert_tan_base','floria_olive_green_base','floria_matte_red_base','floria_burnt_orange_base','floria_persian_blue_base','floria_milky_base','Dây đèn + đuôi đèn','Bóng đèn LED RGB pro','Hộp carton loại 1','Tờ infor Floria'],
 'STRATA': ['Nhựa PLA Matte - Dark Blue Bambu','Nhựa PLA Matte - Navy Blue Tinmorry','Nhựa PLA Matte - Matte Red','Dây đèn + đuôi đèn','Bóng đèn OSRAM LED (5W, 3000K)','Hộp carton loại 2','Tờ infor Strata']
};
(async () => {
let items=[],DATA_META={};
try{const _j=await(await fetch('./inventory.json?t='+Date.now())).json();items=_j.items||[];DATA_META={generated:_j.generated};}catch(e){
document.getElementById('errbox').style.display='block';
document.getElementById('errbox').textContent='Không tải được inventory.json — mở qua HTTP (GitHub Pages)';
return;}
if(DATA_META.generated)document.getElementById('updated').textContent='Cập nhật: '+DATA_META.generated+' · Nguồn: inventory.json';
const CRIT='crit',LOW='low',OK='ok',UNUSED='unused';
items.forEach(d=>{d.state=d.alert===0?UNUSED:d.stock<=d.alert*.5?CRIT:d.stock<=d.alert?LOW:OK});
const total=items.length;
const low=items.filter(d=>d.state===LOW||d.state===CRIT).length;
const crit=items.filter(d=>d.state===CRIT).length;
const ok=items.filter(d=>d.state===OK).length;
document.getElementById('stats').innerHTML=`<div class="stat blue"><div class="num">${total}</div><div class="lbl">Tổng vật tư</div></div><div class="stat green"><div class="num">${ok}</div><div class="lbl">Đủ kho</div></div><div class="stat red"><div class="num">${low}</div><div class="lbl">Sắp hết</div></div><div class="stat amber"><div class="num">${crit}</div><div class="lbl">Nguy cấp</div></div>`;
Chart.defaults.font.family='Montserrat';Chart.defaults.color='#C9CDD4';Chart.defaults.borderColor='rgba(238,238,238,.1)';
const cats={};items.forEach(d=>{cats[d.cat]=(cats[d.cat]||0)+1});
new Chart(document.getElementById('catChart'),{type:'doughnut',data:{labels:Object.keys(cats),datasets:[{data:Object.values(cats),backgroundColor:['#4D79FF','#7EA6FF','#0052E0','#002A8C','#9DB9FF'],borderColor:'#001B5E',borderWidth:3}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{padding:10,usePointStyle:true,font:{size:11}}}}});
new Chart(document.getElementById('statusChart'),{type:'doughnut',data:{labels:['Đủ kho','Sắp hết','Nguy cấp','Không dùng'],datasets:[{data:[ok,low-crit,crit,total-ok-low],backgroundColor:['#30A46C','#E5484D','#FFB224','#8A8F98'],borderColor:'#001B5E',borderWidth:3}]},options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{padding:10,usePointStyle:true,font:{size:11}}}}});
const QTY={'Nhựa PLA - trong suốt R3D':0.135};
const PCOLORS={
 'floria_desert_tan_base':'#C7A57B','floria_olive_green_base':'#626846','floria_matte_red_base':'#B03A3A',
 'floria_burnt_orange_base':'#D46C34','floria_persian_blue_base':'#274FD0','floria_milky_base':'#EAE6DC',
 'floria_standard_skin':'#E8D5C0','strata_matte_red_base':'#B03A3A','strata_matte_red_skin':'#B03A3A',
 'strata_navy_blue_base':'#394157','strata_dark_blue_skin':'#1F2A44',
 'Nhựa PLA - trong suốt R3D':'#CFE3EE','Nhựa PLA Matte - Milky':'#EAE6DC','Nhựa PLA Basic - Persian Blue Bambu':'#274FD0',
 'Nhựa PLA Basic - Burnt Orange R3D':'#D46C34','Nhựa PLA Matte - Matte Red':'#B03A3A',
 'Nhựa PLA Matte - Olive Green Tinmorry':'#626846','Nhựa PLA Matte - Desert Tan Bambu':'#C7A57B',
 'Nhựa PLA Matte - Dark Blue Bambu':'#1F2A44','Nhựa PLA Matte - Navy Blue Tinmorry':'#394157'
};
const byName={};items.forEach(d=>byName[d.name]=d);
function capOf(n,d){if(!d||d.stock==='—')return 0;const q=QTY[n]||1;return Math.floor(d.stock/q);}
const tabsEl=document.getElementById('lampTabs'),panelsEl=document.getElementById('lampPanels');
tabsEl.innerHTML=Object.keys(LAMPS).map((k,i)=>`<button class="chip ${i===0?'active':''}" data-l="${i}">${k}</button>`).join('');
panelsEl.innerHTML=Object.entries(LAMPS).map(([k,names],i)=>{
const rows=names.map(n=>{
const d=byName[n]||{name:n,stock:'—',unit:'',state:'unused',alert:0};
const cap=capOf(n,d);
const pct=d.alert>0?Math.min(d.stock/d.alert,2)/2*100:(d.stock>0?100:0);
const bc=d.state===CRIT?'#FFB224':d.state===LOW?'#E5484D':d.state===UNUSED?'#8A8F98':'#30A46C';
const stTxt=d.state===CRIT?'NGUY CẤP':d.state===LOW?'SẮP HẾT':d.state===UNUSED?'KHÔNG DÙNG':'ĐỦ';
const stColor=d.state===CRIT?'#FFB224':d.state===LOW?'#E5484D':d.state===UNUSED?'#8A8F98':'#30A46C';
const chip=PCOLORS[n]?`<span class="pchip" style="background:${PCOLORS[n]}"></span>`:'';
return `<div class="part"><div class="pn">${chip}${n}</div><div class="pv"><span class="ps ${d.state===OK?'':'warn'}">${d.stock}</span><span class="pu">${d.unit}</span></div><div class="pbar"><div style="width:${pct}%;background:${bc}"></div></div><div class="pcap"><b>≈${cap}</b> đèn · <span style="color:${stColor};font-weight:700">${stTxt}</span></div></div>`}).join('');
const shared=names.filter(n=>!n.includes('_base')||n.includes('skin')).map(n=>capOf(n,byName[n]));
const capacity=shared.length?Math.min(...shared):0;
return `<div class="parts-grid ${i===0?'show':''}" id="lp${i}"><div class="capacity">⚡ Đủ linh kiện chung để lắp <b>≈${capacity}</b> đèn (chưa tính base theo màu)</div>${rows}</div>`}).join('');
tabsEl.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
document.querySelectorAll('.lamp-tabs .chip').forEach(x=>x.classList.toggle('active',x.dataset.l===b.dataset.l));
document.querySelectorAll('.parts-grid').forEach((g,i)=>g.classList.toggle('show',String(i)===b.dataset.l))});
let filter='ALL';
const catsAll=['ALL',...new Set(items.map(d=>d.cat))];
const filtersEl=document.getElementById('filters');
filtersEl.innerHTML=catsAll.map(c=>`<button class="chip ${c==='ALL'?'active':''}" data-c="${c}">${c}</button>`).join('');
filtersEl.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.c;
document.querySelectorAll('#filters .chip').forEach(x=>x.classList.toggle('active',x.dataset.c===filter));render()});
function render(){
const rows=items.filter(d=>filter==='ALL'||d.cat===filter);
document.getElementById('tbody').innerHTML=rows.map(d=>{
const pct=d.alert>0?Math.min(d.stock/d.alert,2)/2*100:100;
const bc=d.state===CRIT?'#FFB224':d.state===LOW?'#E5484D':d.state===UNUSED?'#8A8F98':'#30A46C';
return `<tr><td>${d.name}</td><td class="hm"><span class="cat-tag">${d.cat}</span></td><td style="font-weight:800;font-size:15px;color:${d.state===OK?'#7EA6FF':'#EEEEEE'}">${d.stock}</td><td class="hm">${d.unit}</td><td class="hm" style="min-width:140px"><div class="bar"><div style="width:${pct}%;background:${bc}"></div></div></td><td><span class="badge ${d.state}">${d.state.toUpperCase()}</span></td></tr>`}).join('')}
render();
})();
</script>
</body>
</html>
